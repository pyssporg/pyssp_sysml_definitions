[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyssp-sysml-definitions"
dynamic = ["version"]
description = "Installable, dependency-free SysML vocabulary shared by artifact families."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "pyssp contributors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "build",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
pyssp_sysml_definitions = ["*.sysml"]

[tool.setuptools.dynamic]
version = { attr = "pyssp_sysml_definitions.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyssp_sysml_definitions*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
