name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        # The editable install is how the version guard reads
        # pyssp_sysml_definitions.__version__: the project uses
        # dynamic = ["version"].
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Check artifacts
        # The version is dynamic, so the artifact names and metadata are checked
        # instead of being assumed.
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          dist = pathlib.Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          assert not any("0.0.0" in path.name for path in dist.iterdir()), list(dist.iterdir())

          wheel = wheels[0]
          version = wheel.name.split("-", 1)[1].split("-")[0]
          sdist_version = sdists[0].name.removesuffix(".tar.gz").split("-", 1)[1]
          assert version != "0.0.0", wheel.name
          assert sdist_version == version, sdists[0].name

          with zipfile.ZipFile(wheel) as zf:
              assert zf.testzip() is None
              metadata = next(
                  name for name in zf.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              text = zf.read(metadata).decode()
          assert "Name: pyssp-sysml-definitions" in text, text
          assert f"Version: {version}" in text, text
          print(wheel.name)
          PY

      - name: Check the version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python -c 'import pyssp_sysml_definitions; print(pyssp_sysml_definitions.__version__)')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyssp_sysml_definitions.__version__ ${version}." >&2
            exit 1
          fi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
